name: 每日更新板塊輪動資料

on:
  schedule:
    # 美股收盤後（台灣時間週二到週六早上 7:17）
    - cron: "17 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.40" "pandas>=2.0"
      - run: python scripts/build_data.py
      - name: 有變動才 commit
        run: |
          git config user.name "rrg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rrg.json
          git diff --cached --quiet || (git commit -m "更新板塊輪動資料 $(date -u +%F)" && git push)
